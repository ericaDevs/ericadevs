{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="font-mont min-h-screen flex flex-col items-center justify-center px-4 bg-[#f8fafc]">
    <div class="flex w-full max-w-5xl justify-end pb-3">
        <a href="{% url 'home' %}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
            <i data-lucide="globe" class="h-3.5 w-3.5 text-slate-500"></i>
            Open Public Site
        </a>
    </div>
        
    <div class="w-full max-w-5xl overflow-hidden rounded-4xl border border-blue/10 bg-white shadow-[0_20px_60px_rgba(1,26,56,0.08)]">
        <div class="grid md:grid-cols-2">
            <div class="hidden md:flex flex-col justify-between bg-navy p-10 text-white">
                <div>
                    <p class="text-xs font-bold uppercase tracking-[0.3em] text-green">ericaDevs</p>
                    <h1 class="mt-6 text-4xl font-bold leading-tight">Welcome back.</h1>
                </div>

                <div class="space-y-6">
                    <div class="rounded-2xl border border-white/10 bg-white/5 p-5">
                        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-green">Portfolio dashboard</p>
                        <p class="mt-3 text-sm leading-6 text-white/75">
                            Manage projects, track contact messages, and keep your portfolio organised with a clean overview.
                        </p>
                    </div>

                    <div class="flex items-center gap-3 text-sm text-white/75">
                        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-blue">
                            <i data-lucide="shield-check" class="h-4 w-4"></i>
                        </span>
                        Secure admin access
                    </div>
                </div>
            </div>

            <div class="p-8 sm:p-10 lg:p-12">
                <div class="mb-8">
                    <p class="text-xs font-bold uppercase tracking-[0.25em] text-blue">Admin access</p>
                    <h2 class="mt-3 text-3xl font-bold text-navy">Login</h2>
                </div>

                <form method="post" action="{% url 'dashboard:login' %}" class="space-y-6">
                    {% csrf_token %}

                    <div>
                        <label for="username" class="mb-2 block text-sm font-semibold text-navy">Username</label>
                        <div class="relative">
                            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-navy/60">
                                <i data-lucide="user" class="h-4 w-4"></i>
                            </span>
                            <input id="username" name="username" type="text" placeholder="Enter your username" class="w-full rounded-xl border border-blue/15 bg-[#F5F9FF] py-3 pl-11 pr-4 text-sm text-navy outline-none transition placeholder:text-navy/50 focus:border-blue focus:ring-2 focus:ring-blue/10" required />
                        </div>
                    </div>

                    <div>
                        <label for="password" class="mb-2 block text-sm font-semibold text-navy">Password</label>
                        <div class="relative">
                            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-navy/60">
                                <i data-lucide="lock" class="h-4 w-4"></i>
                            </span>
                            <input id="password" name="password" type="password" placeholder="Enter your password" class="w-full rounded-xl border border-blue/15 bg-[#F5F9FF] py-3 pl-11 pr-4 text-sm text-navy outline-none transition placeholder:text-navy/50 focus:border-blue focus:ring-2 focus:ring-blue/10" required />
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-3 text-sm">
                        <label class="flex items-center gap-2 text-navy/70">
                            <input type="checkbox" class="h-4 w-4 rounded border-blue/30 text-blue focus:ring-blue" />
                            Remember me
                        </label>
                        <a href="#" class="font-medium text-blue hover:text-navy">Forgot password?</a>
                    </div>

                    <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-navy px-5 py-3.5 text-sm font-bold text-white transition hover:bg-blue">
                        Login
                        <i data-lucide="arrow-right" class="h-4 w-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
